<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XSS + Cookie Demo</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; }
        input { padding: 8px; width: 400px; }
        button { padding: 8px 16px; margin: 4px; cursor: pointer; }
        .vuln { color: red; }
        .safe { color: green; }
        hr { margin: 24px 0; }
    </style>
</head>
<body>

    <h1>XSS + Cookie Demo</h1>

    <h3>Step 1 — Set the cookie</h3>
    <button onclick="window.open('http://localhost:3000/login', '_blank')">Login Vulnerable (port 3000)</button>
    <button onclick="window.open('http://localhost:3001/login', '_blank')">Login Safe (port 3001)</button>

    <hr>

    <h3>Step 2 — Inject payload</h3>
    <input type="text" id="payload" value="<script>alert(document.cookie)</script>" />
    <br><br>
    <button class="vuln" onclick="testVuln()">Test Vulnerable (port 3000)</button>
    <button class="safe" onclick="testSafe()">Test Safe (port 3001)</button>

    <script>
        function testVuln() {
            const payload = document.getElementById("payload").value;
            window.open("http://localhost:3000/profile?name=" + encodeURIComponent(payload), "_blank");
        }

        function testSafe() {
            const payload = document.getElementById("payload").value;
            window.open("http://localhost:3001/profile?name=" + encodeURIComponent(payload), "_blank");
        }
    </script>

</body>
</html>
