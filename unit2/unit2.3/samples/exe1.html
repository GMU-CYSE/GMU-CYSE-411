<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XSS Search Demo</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        input { padding: 8px; width: 300px; }
        button { padding: 8px 16px; margin: 4px; cursor: pointer; }
        #results { margin-top: 20px; border: 1px solid #ccc; padding: 16px; min-height: 50px; }
        .note { background: #fff3cd; border: 1px solid #ffc107; padding: 12px; margin-top: 20px; font-size: 0.9em; }
        code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Product Search</h1>
    <p>Search for a product and see the results below.</p>

    <input type="text" id="searchInput" placeholder="Enter product name..." />
    <button onclick="search()">Search</button>

    <br><br>
    <strong>XSS Test Payloads:</strong><br>
    <button onclick="injectPayload1()">Test 1: img onerror (auto)</button>
    <button onclick="injectPayload2()">Test 2: details ontoggle (auto)</button>
    <button onclick="injectPayload3()">Test 3: input autofocus (auto)</button>
    <button onclick="injectPayload4()">Test 4: a onclick (click the link)</button>

    <div id="results"></div>

    <div class="note">
        <strong>Note:</strong> <code>&lt;script&gt;alert()&lt;/script&gt;</code> via innerHTML is blocked by browsers (HTML5 spec).<br>
        Use event-based payloads instead: <code>&lt;img src=x onerror=alert(1)&gt;</code>
    </div>

    <script>
        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            const query = params.get("q");
            if (query) {
                document.getElementById("searchInput").value = query;
                displayResults(query);
            }
        };

        function search() {
            const query = document.getElementById("searchInput").value;
            displayResults(query);
        }

        // VULNERABLE: user input injected directly into innerHTML without sanitization
        function displayResults(query) {
            document.getElementById("results").innerHTML =
                "You searched for: <strong>" + query + "</strong>";
        }

        function injectPayload1() {
            // img with broken src — onerror fires immediately
            const payload = "<img src=x onerror=alert(1)>";
            document.getElementById("searchInput").value = payload;
            displayResults(payload);
        }

        function injectPayload2() {
            // details ontoggle fires synchronously during innerHTML parsing,
            // so setTimeout(0) lets the browser paint the input value first
            const payload = "<details open ontoggle=alert(2)><summary>x</summary></details>";
            document.getElementById("searchInput").value = payload;
            setTimeout(() => displayResults(payload), 0);
        }

        function injectPayload3() {
            // autofocus moves focus to the injected input, triggering onfocus immediately
            const payload = "<input autofocus onfocus=alert(3)>";
            document.getElementById("searchInput").value = payload;
            displayResults(payload);
        }

        function injectPayload4() {
            // requires user to click the "Click here" link that appears in the results
            const payload = '<a href="#" onclick="alert(4);return false">Click here</a>';
            document.getElementById("searchInput").value = payload;
            displayResults(payload);
        }
    </script>
</body>
</html>
